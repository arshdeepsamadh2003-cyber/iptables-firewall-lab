
name: iptables-firewall-lab

topology:
  nodes:

    # FIREWALL ROUTER
    router:
      kind: linux
      image: alpine:latest
      binds:
        - ./config/iptables.rules:/etc/iptables.rules:ro
      exec:
        - apk add --no-cache iproute2 iptables
        - ip addr add 10.1.1.1/24 dev eth1
        - ip addr add 192.168.10.1/24 dev eth2
        - ip addr add 172.16.1.1/24 dev eth3
        - ip addr add 172.16.1.2/24 dev eth4
        - ip route replace 172.16.1.100/32 dev eth3
        - ip route replace 172.16.1.200/32 dev eth4
        - sysctl -w net.ipv4.ip_forward=1
        - sh -c 'iptables-restore < /etc/iptables.rules'

    # LAN CLIENT
    lan-client:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache iproute2 curl
        - ip addr add 10.1.1.10/24 dev eth1
        - ip route replace default via 10.1.1.1 dev eth1

    # DMZ WEB SERVER
    dmz-server:
      kind: linux
      image: nginx:alpine
      exec:
        - apk add --no-cache iproute2
        - ip addr add 192.168.10.10/24 dev eth1
        - ip route replace default via 192.168.10.1 dev eth1

    # WAN CLIENT
    wan-client:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache iproute2 curl busybox-extras
        - ip addr add 172.16.1.100/24 dev eth1
        - ip route replace default via 172.16.1.1 dev eth1

    # WAN ATTACKER
    wan-attacker:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache iproute2 curl
        - ip addr add 172.16.1.200/24 dev eth1
        - ip route replace default via 172.16.1.2 dev eth1

  links:
    # LAN to Firewall
    - endpoints: ["lan-client:eth1", "router:eth1"]

    # DMZ to Firewall
    - endpoints: ["dmz-server:eth1", "router:eth2"]

    # WAN Client to Firewall
    - endpoints: ["wan-client:eth1", "router:eth3"]

    # WAN Attacker to Firewall
    - endpoints: ["wan-attacker:eth1", "router:eth4"]
